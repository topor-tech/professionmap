services:
  landing:
    build:
      context: ../src/front/landing
      dockerfile: Dockerfile
    ports:
      - "3333:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  ats:
    build:
      context: ../src/front/ats
      dockerfile: Dockerfile
    ports:
      - "2333:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped


  professionmap-ats:
    build:
      context: ../src/back/ats
      dockerfile: Dockerfile
    ports:
      - "8333:8000"
    environment:
      - DATABASE_URL=postgresql://ats:ats@professionmap-postgres:5432/professionmap_ats
      - IS_DEVELOPMENT=false
      - SENTRY_ENVIRONMENT=production
      - BASE_URL=https://ats.professionmap.ru/job_page
    env_file:
      - prod.env
    depends_on:
      - professionmap-postgres
      - gotenberg
    restart: unless-stopped

  professionmap-postgres:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=ats
      - POSTGRES_PASSWORD=ats
      - POSTGRES_DB=professionmap_ats
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - 3000:3000
    environment:
      - GOTENBERG_LOG_LEVEL=info
    restart: unless-stopped